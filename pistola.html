<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Offis - Shooter Fix</title>
    <style>
        :root { --primary: #00aaff; --accent: #ff00aa; }
        body { 
            margin: 0; background-color: #050510; color: white; 
            font-family: 'Inter', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui { position: absolute; top: 10px; width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; }
        #score { font-size: 24px; color: var(--primary); font-weight: bold; }
        canvas { 
            background: #050510; border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; max-width: 98vw; max-height: 70vh; 
        }
        #joystick { position: fixed; bottom: 40px; left: 10%; }
        #shootBtn { 
            position: fixed; bottom: 40px; right: 10%; 
            background: linear-gradient(135deg, var(--accent), #8e54ff); 
            border: none; border-radius: 50%; width: 80px; height: 80px; 
            font-size: 35px; color: white; z-index: 20; outline: none;
        }
    </style>
    <script src="https://unpkg.com/nipplejs@0.8.6/dist/nipplejs.js"></script>
</head>
<body>
    <div id="ui">
        <div id="score">PUNTAJE: 0</div>
        <div style="color: var(--accent)">ANIME OFFIS AF</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick"></div>
    <button id="shootBtn">🔫</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = Math.min(window.innerWidth * 0.95, 800);
            canvas.height = Math.min(window.innerHeight * 0.65, 500);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CONFIGURACIÓN DE IMÁGENES ---
        const imgP = new Image(); imgP.src = 'player.png';
        const imgE = new Image(); imgE.src = 'enemy.png';
        const imgSuelo = new Image(); imgSuelo.src = 'suelo.png';

        const groundHeight = 80; // Altura visual de la imagen del pasto
        let player = { 
            x: canvas.width/2 - 20, 
            y: canvas.height - groundHeight - 20, // Empieza arriba del pasto
            width: 40, height: 40, speed: 5 
        };
        
        let bullets = [], enemies = [], enemyBullets = [], score = 0, gameOver = false;

        // Joystick
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick'),
            mode: 'static',
            position: { left: '50px', bottom: '120px' },
            color: '#00aaff', size: 120
        });

        let moveDir = { x: 0, y: 0 };
        joystick.on('move', (e, data) => { if(data.vector) { moveDir.x = data.vector.x; moveDir.y = -data.vector.y; }});
        joystick.on('end', () => { moveDir = { x: 0, y: 0 }; });

        function shoot() { if(!gameOver) bullets.push({ x: player.x + 16, y: player.y, width: 8, height: 20, speed: 10 }); }
        function spawnEnemy() {
            if(gameOver) return;
            enemies.push({ x: Math.random()*(canvas.width-40), y: -50, width: 40, height: 40, speed: 2, dir: 1 });
        }

        function update() {
            if(gameOver) return;

            player.x += moveDir.x * player.speed;
            player.y += moveDir.y * player.speed;

            // --- LÍMITES PARA QUE NO SE META AL PASTO ---
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            // El límite inferior es la altura del canvas menos la altura de la imagen del suelo
            player.y = Math.max(0, Math.min(canvas.height - groundHeight - player.height + 20, player.y));

            bullets.forEach(b => b.y -= b.speed);
            enemyBullets.forEach(eb => eb.y += eb.speed);
            enemies.forEach(e => {
                e.y += 0.8; e.x += e.speed * e.dir;
                if(e.x <= 0 || e.x >= canvas.width - e.width) e.dir *= -1;
                if(Math.random() < 0.01) enemyBullets.push({x: e.x + 15, y: e.y + 40, width: 6, height: 12, speed: 5});
            });

            // Colisiones (Balas vs Enemigos)
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if(b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        bullets.splice(bi, 1); enemies.splice(ei, 1);
                        score++; document.getElementById("score").innerText = "PUNTAJE: " + score;
                    }
                });
            });

            // Colisiones (Balas Enemigas vs Jugador)
            enemyBullets.forEach((eb) => {
                if(eb.x < player.x + player.width && eb.x + eb.width > player.x && eb.y < player.y + player.height && eb.y + eb.height > player.y) {
                    gameOver = true;
                    alert("GAME OVER - Puntaje: " + score);
                    location.reload();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar el Suelo al FINAL de la lógica de capas (Atrás de todo)
            // Lo dibujamos como una franja en la parte de abajo
            if(imgSuelo.complete) {
                ctx.drawImage(imgSuelo, 0, canvas.height - groundHeight, canvas.width, groundHeight);
            }

            // 2. Dibujar proyectiles
            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
            ctx.fillStyle = "#ff00aa";
            enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.width, eb.height));

            // 3. Dibujar personajes (Aparecerán SOBRE el pasto)
            enemies.forEach(e => ctx.drawImage(imgE, e.x, e.y, e.width, e.height));
            ctx.drawImage(imgP, player.x, player.y, player.width, player.height);
            
            if(!gameOver) requestAnimationFrame(draw);
        }

        document.getElementById("shootBtn").addEventListener("click", shoot);
        setInterval(spawnEnemy, 2000);
        
        function gameLoop() {
            update();
            setTimeout(() => { if(!gameOver) gameLoop(); }, 1000/60);
        }
        
        gameLoop();
        draw();
    </script>
</body>
</html>
