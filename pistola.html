<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Offis - Pasto Total</title>
    <style>
        :root { --primary: #00aaff; --accent: #ff00aa; }
        body { 
            margin: 0; background-color: #050510; color: white; 
            font-family: 'Inter', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        #ui { position: absolute; top: 10px; width: 100%; max-width: 800px; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 10; pointer-events: none; }
        #score { font-size: 24px; color: var(--primary); font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        canvas { 
            border: 2px solid rgba(255,255,255,0.1); 
            border-radius: 15px; max-width: 95vw; max-height: 75vh; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #joystick { position: fixed; bottom: 40px; left: 10%; z-index: 20; }
        #shootBtn { 
            position: fixed; bottom: 40px; right: 10%; 
            background: linear-gradient(135deg, var(--accent), #8e54ff); 
            border: none; border-radius: 50%; width: 80px; height: 80px; 
            font-size: 35px; color: white; z-index: 20; outline: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
    <script src="https://unpkg.com/nipplejs@0.8.6/dist/nipplejs.js"></script>
</head>
<body>
    <div id="ui">
        <div id="score">PUNTAJE: 0</div>
        <div style="color: var(--accent); font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">ANIME OFFIS AF</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="joystick"></div>
    <button id="shootBtn">🔫</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = Math.min(window.innerWidth * 0.95, 800);
            canvas.height = Math.min(window.innerHeight * 0.70, 550);
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CARGA DE ASSETS ---
        const imgP = new Image(); imgP.src = 'player.png';
        const imgE = new Image(); imgE.src = 'enemy.png';
        const imgSuelo = new Image(); imgSuelo.src = 'suelo.png';

        let player = { 
            x: canvas.width/2 - 20, 
            y: canvas.height - 100, 
            width: 45, height: 45, speed: 5 
        };
        
        let bullets = [], enemies = [], enemyBullets = [], score = 0, gameOver = false;

        // Joystick
        const joystick = nipplejs.create({
            zone: document.getElementById('joystick'),
            mode: 'static',
            position: { left: '50px', bottom: '120px' },
            color: '#00aaff', size: 120
        });

        let moveDir = { x: 0, y: 0 };
        joystick.on('move', (e, data) => { if(data.vector) { moveDir.x = data.vector.x; moveDir.y = -data.vector.y; }});
        joystick.on('end', () => { moveDir = { x: 0, y: 0 }; });

        function shoot() { if(!gameOver) bullets.push({ x: player.x + player.width/2 - 4, y: player.y, width: 8, height: 20, speed: 10 }); }
        
        function spawnEnemy() {
            if(gameOver) return;
            enemies.push({ 
                x: Math.random()*(canvas.width-40), 
                y: -50, width: 40, height: 40, 
                speed: 1.5 + (score * 0.05), // Dificultad progresiva
                dir: Math.random() > 0.5 ? 1 : -1 
            });
        }

        function update() {
            if(gameOver) return;

            player.x += moveDir.x * player.speed;
            player.y += moveDir.y * player.speed;

            // Límites de pantalla
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            bullets.forEach(b => b.y -= b.speed);
            enemyBullets.forEach(eb => eb.y += eb.speed);
            
            enemies.forEach(e => {
                e.y += 0.7; 
                e.x += e.speed * e.dir;
                if(e.x <= 0 || e.x >= canvas.width - e.width) e.dir *= -1;
                if(Math.random() < 0.012) enemyBullets.push({x: e.x + 15, y: e.y + 40, width: 6, height: 12, speed: 5});
            });

            // Colisiones
            bullets.forEach((b, bi) => {
                enemies.forEach((e, ei) => {
                    if(b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        bullets.splice(bi, 1); enemies.splice(ei, 1);
                        score++; document.getElementById("score").innerText = "PUNTAJE: " + score;
                    }
                });
            });

            enemyBullets.forEach((eb) => {
                if(eb.x < player.x + player.width && eb.x + eb.width > player.x && eb.y < player.y + player.height && eb.y + eb.height > player.y) {
                    gameOver = true;
                    alert("GAME OVER - Puntaje: " + score);
                    location.reload();
                }
            });

            // Limpieza
            bullets = bullets.filter(b => b.y > -20);
            enemyBullets = enemyBullets.filter(eb => eb.y < canvas.height + 20);
            enemies = enemies.filter(e => e.y < canvas.height + 50);
        }

        function draw() {
            // 1. DIBUJAR EL PASTO EN TODA LA PANTALLA
            if(imgSuelo.complete) {
                // Creamos un patrón para que la imagen se repita y cubra todo el canvas
                const pattern = ctx.createPattern(imgSuelo, 'repeat');
                ctx.fillStyle = pattern;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#1d3511";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Capa de Disparos
            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
            ctx.fillStyle = "#ff00aa";
            enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.width, eb.height));

            // 3. Capa de Personajes
            enemies.forEach(e => ctx.drawImage(imgE, e.x, e.y, e.width, e.height));
            ctx.drawImage(imgP, player.x, player.y, player.width, player.height);
            
            if(!gameOver) requestAnimationFrame(draw);
        }

        document.getElementById("shootBtn").addEventListener("click", shoot);
        setInterval(spawnEnemy, 1800);
        
        function gameLoop() {
            update();
            setTimeout(() => { if(!gameOver) gameLoop(); }, 1000/60);
        }
        
        gameLoop();
        draw();
    </script>
</body>
</html>
