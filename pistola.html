<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Disparos - Anime Offis</title>
    <style>
        body { text-align: center; background-color: black; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        canvas { display: block; margin: auto; border: 2px solid #00aaff; background: #050510; }
        #score { font-size: 20px; margin-top: 10px; color: #00aaff; font-weight: bold; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 30px; background-color: #006400; z-index: -1; }
        #joystick { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); }
        #shootBtn { 
            position: absolute; bottom: 20px; right: 20px; 
            background: linear-gradient(90deg, #ff00aa, #8e54ff); 
            border: none; border-radius: 50%; width: 70px; height: 70px; 
            font-size: 30px; color: white; cursor: pointer; 
            box-shadow: 0 0 15px rgba(255, 0, 170, 0.5);
        }
    </style>
    <script src="https://unpkg.com/nipplejs@0.8.6/dist/nipplejs.js"></script>
</head>
<body>
    <p id="score">Puntaje: 0</p>
    <canvas id="gameCanvas" width="400" height="300"></canvas>
    <div id="joystick"></div>
    <button id="shootBtn">🔫</button>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = { x: 175, y: 220, width: 30, height: 30, speed: 4 };
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let score = 0;
        let gameOver = false; // Variable clave para detener el juego

        const playerImage = new Image(); playerImage.src = 'player.png';
        const enemyImage = new Image(); enemyImage.src = 'enemy.png';
        const groundImage = new Image(); groundImage.src = 'suelo.png';

        const joystick = nipplejs.create({
            zone: document.getElementById('joystick'),
            mode: 'static',
            position: { left: '50%', bottom: '150px' },
            color: '#00aaff',
            size: 120
        });

        // Manejo de movimiento suave
        let moveDir = { x: 0, y: 0 };
        joystick.on('move', (evt, data) => {
            if (data.vector) {
                moveDir.x = data.vector.x;
                moveDir.y = -data.vector.y;
            }
        });
        joystick.on('end', () => { moveDir = { x: 0, y: 0 }; });

        function shoot() {
            if (gameOver) return;
            bullets.push({ x: player.x + 11, y: player.y, width: 8, height: 15, speed: 7 });
        }

        function spawnEnemy() {
            if (gameOver) return;
            let x = Math.random() * (canvas.width - 30);
            enemies.push({ x, y: 10, width: 30, height: 30, speed: 1.5, direction: 1 });
        }

        function enemyShoot(enemy) {
            if (gameOver) return;
            enemyBullets.push({ x: enemy.x + 12, y: enemy.y + 30, width: 6, height: 12, speed: 4 });
        }

        function checkCollisions() {
            // Balas del jugador vs Enemigos
            bullets.forEach((bullet, bIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    if (bullet.x < enemy.x + enemy.width && bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height && bullet.y + bullet.height > enemy.y) {
                        bullets.splice(bIndex, 1);
                        enemies.splice(eIndex, 1);
                        score++;
                        document.getElementById("score").innerText = "Puntaje: " + score;
                    }
                });
            });

            // Balas enemigas vs Jugador
            enemyBullets.forEach((bullet) => {
                if (!gameOver && bullet.x < player.x + player.width && bullet.x + bullet.width > player.x &&
                    bullet.y < player.y + player.height && bullet.y + bullet.height > player.y) {
                    endGame();
                }
            });
        }

        function endGame() {
            gameOver = true; // Bloqueamos actualizaciones
            alert("¡Perdiste! Puntaje final: " + score);
            location.reload();
        }

        function update() {
            if (gameOver) return;

            // Movimiento del jugador
            player.x += moveDir.x * player.speed;
            player.y += moveDir.y * player.speed;

            // Límites del canvas
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height - 10, player.y));

            bullets.forEach(bullet => bullet.y -= bullet.speed);
            enemyBullets.forEach(bullet => bullet.y += bullet.speed);

            bullets = bullets.filter(b => b.y > -20);
            enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20);

            enemies.forEach(enemy => {
                enemy.x += enemy.speed * enemy.direction;
                if (enemy.x <= 0 || enemy.x >= canvas.width - enemy.width) enemy.direction *= -1;
                if (Math.random() < 0.02) enemyShoot(enemy);
            });

            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Suelo (si no carga imagen, no rompe el dibujo)
            if (groundImage.complete) {
                ctx.drawImage(groundImage, 0, canvas.height - 40, canvas.width, 40);
            }

            ctx.drawImage(playerImage, player.x, player.y, player.width, player.height);

            ctx.fillStyle = "#00ffcc";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            ctx.fillStyle = "#ff00aa";
            enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            enemies.forEach(e => ctx.drawImage(enemyImage, e.x, e.y, e.width, e.height));
        }

        function gameLoop() {
            if (!gameOver) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        document.getElementById("shootBtn").addEventListener("click", shoot);
        setInterval(spawnEnemy, 2500); // Aparecen más seguido para que sea divertido
        gameLoop();
    </script>
</body>
</html>
