<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Protocol - Anime Offis</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00aaff;
            --accent: #ff00aa;
            --bg-dark: #050510;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            text-align: center;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at top right, #1a1a3a, var(--bg-dark));
            min-height: 100vh;
        }

        h1, h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); text-transform: uppercase; }

        /* Contenedores de Sección */
        .section { display: none; max-width: 600px; margin: auto; padding: 20px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px); }
        .active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Botones Estilo Anime Offis */
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: linear-gradient(90deg, var(--primary), #0066ff);
            color: white;
            border: none;
            border-radius: 30px;
            font-family: 'Orbitron';
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3);
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px var(--primary); }
        .btn-secondary { background: var(--glass); border: 1px solid var(--primary); }

        /* El Puzzle */
        #puzzle {
            display: grid;
            margin: 20px auto;
            gap: 2px;
            border: 3px solid var(--primary);
            background: var(--primary);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.2);
            max-width: 100%;
        }
        .pieza {
            cursor: pointer;
            background-repeat: no-repeat;
            transition: filter 0.2s;
        }
        .pieza:hover { filter: brightness(1.2); }
        .pieza.selected { outline: 3px solid var(--accent); outline-offset: -3px; filter: brightness(1.3); }

        /* Configuración e Historial */
        input[type="number"], input[type="file"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--primary);
            color: white;
            padding: 8px;
            border-radius: 10px;
            margin: 10px 0;
            font-family: 'Orbitron';
        }
        .historial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .historial-grid img { width: 100%; border-radius: 10px; border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/456" preload="auto"></audio>
    <audio id="swapSound" src="https://www.fesliyanstudios.com/play-mp3/457" preload="auto"></audio>

    <div id="menu" class="section active">
        <h1>Puzzle Protocol</h1>
        <p style="opacity: 0.7;">Anime Offis GDL Edition</p>
        <button class="btn" onclick="sonidoClick(); mostrarSeccion('juego')">INICIAR JUEGO</button><br>
        <button class="btn btn-secondary" onclick="sonidoClick(); mostrarSeccion('configuracion')">CONFIGURACIÓN</button>
        <button class="btn btn-secondary" onclick="sonidoClick(); mostrarSeccion('historial')">HISTORIAL</button>
    </div>

    <div id="configuracion" class="section">
        <h2>Ajustes de Red</h2>
        <div style="text-align: left; padding: 0 20px;">
            <label>Filas: <input type="number" id="filas" value="3" min="2" max="6"></label><br>
            <label>Columnas: <input type="number" id="columnas" value="3" min="2" max="6"></label><br>
            <label>Imagen Personalizada: <br><input type="file" id="imagenInput" accept="image/*"></label>
        </div>
        <button class="btn" onclick="sonidoClick(); guardarConfiguracion()">APLICAR</button>
        <button class="btn btn-secondary" onclick="sonidoClick(); mostrarSeccion('menu')">VOLVER</button>
    </div>

    <div id="juego" class="section">
        <h2 id="puzzleTitle">RECONSTRUYENDO...</h2>
        <div id="puzzle"></div>
        <button class="btn btn-secondary" onclick="sonidoClick(); mostrarSeccion('menu')">ABANDONAR</button>
    </div>

    <div id="historial" class="section">
        <h2>Memoria de Datos</h2>
        <div id="listaHistorial" class="historial-grid"></div>
        <button class="btn btn-secondary" onclick="sonidoClick(); mostrarSeccion('menu')">VOLVER</button>
    </div>

    <script>
        let filas = 3, columnas = 3;
        let imagenSrc = "https://qu.ax/JrOvP.jpg"; // Tu imagen por defecto
        let puzzle = document.getElementById("puzzle");
        let seleccionada = null;

        function sonidoClick() { document.getElementById("clickSound").play().catch(()=>{}); }
        function sonidoIntercambio() { document.getElementById("swapSound").play().catch(()=>{}); }

        function mostrarSeccion(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            if (id === "juego") iniciarJuego();
            if (id === "historial") mostrarHistorial();
        }

        function guardarConfiguracion() {
            filas = parseInt(document.getElementById("filas").value);
            columnas = parseInt(document.getElementById("columnas").value);
            let archivo = document.getElementById("imagenInput").files[0];
            if (archivo) {
                let reader = new FileReader();
                reader.onload = (e) => { imagenSrc = e.target.result; mostrarSeccion("menu"); };
                reader.readAsDataURL(archivo);
            } else {
                mostrarSeccion("menu");
            }
        }

        function iniciarJuego() {
            puzzle.innerHTML = "";
            
            // Calculamos el tamaño responsivo
            const maxWidth = Math.min(window.innerWidth - 60, 500);
            const piezaW = maxWidth / columnas;
            const piezaH = piezaW; // Hacemos que sean cuadradas para mejor estética
            
            puzzle.style.gridTemplateColumns = `repeat(${columnas}, 1fr)`;
            puzzle.style.width = `${maxWidth}px`;

            let piezas = [];
            for (let i = 0; i < filas * columnas; i++) {
                let pieza = document.createElement("div");
                pieza.className = "pieza";
                pieza.style.width = `${piezaW}px`;
                pieza.style.height = `${piezaH}px`;
                pieza.style.backgroundImage = `url(${imagenSrc})`;
                pieza.style.backgroundSize = `${maxWidth}px ${piezaH * filas}px`;
                
                let posX = -(i % columnas) * piezaW;
                let posY = -Math.floor(i / columnas) * piezaH;
                
                pieza.style.backgroundPosition = `${posX}px ${posY}px`;
                pieza.dataset.correctPos = `${posX} ${posY}`; // Guardamos la posición correcta
                pieza.onclick = () => intercambiarPieza(pieza);
                piezas.push(pieza);
            }
            
            // Mezclar
            piezas.sort(() => Math.random() - 0.5);
            piezas.forEach(p => puzzle.appendChild(p));
        }

        function intercambiarPieza(pieza) {
            if (!seleccionada) {
                seleccionada = pieza;
                pieza.classList.add("selected");
            } else {
                if (seleccionada === pieza) {
                    pieza.classList.remove("selected");
                    seleccionada = null;
                    return;
                }
                
                sonidoIntercambio();
                let tempPos = seleccionada.style.backgroundPosition;
                seleccionada.style.backgroundPosition = pieza.style.backgroundPosition;
                pieza.style.backgroundPosition = tempPos;
                
                seleccionada.classList.remove("selected");
                seleccionada = null;
                verificarCompleto();
            }
        }

        function verificarCompleto() {
            let piezas = Array.from(puzzle.children);
            let correcto = piezas.every((p, i) => {
                let posX = -(i % columnas) * (puzzle.offsetWidth / columnas);
                let posY = -Math.floor(i / columnas) * (puzzle.offsetWidth / columnas);
                // Comparamos con un margen de error pequeño por redondeo de pixeles
                return p.style.backgroundPosition.includes(`${Math.round(posX)}px`) && 
                       p.style.backgroundPosition.includes(`${Math.round(posY)}px`);
            });

            if (correcto) {
                document.getElementById("puzzleTitle").innerText = "¡SINCRO COMPLETADA!";
                setTimeout(() => {
                    alert("Protocolo completado con éxito.");
                    guardarEnHistorial();
                    mostrarSeccion("menu");
                }, 500);
            }
        }

        function guardarEnHistorial() {
            let h = JSON.parse(localStorage.getItem("af_puzzle_hist")) || [];
            h.push(imagenSrc);
            localStorage.setItem("af_puzzle_hist", JSON.stringify(h.slice(-10))); // Guardar últimos 10
        }

        function mostrarHistorial() {
            let lista = document.getElementById("listaHistorial");
            lista.innerHTML = "";
            let h = JSON.parse(localStorage.getItem("af_puzzle_hist")) || [];
            if (h.length === 0) {
                lista.innerHTML = "<p>Sin registros anteriores.</p>";
                return;
            }
            h.forEach(src => {
                let img = document.createElement("img");
                img.src = src;
                lista.appendChild(img);
            });
        }
    </script>
</body>
</html>
