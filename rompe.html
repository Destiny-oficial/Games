<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Protocol - Anime Offis</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aaff; --accent: #ff00aa; --bg-dark: #050510; --glass: rgba(255, 255, 255, 0.05); }
        body { text-align: center; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 20px; background: radial-gradient(circle at top right, #1a1a3a, var(--bg-dark)); min-height: 100vh; }
        h1, h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); text-transform: uppercase; }
        .section { display: none; max-width: 600px; margin: auto; padding: 20px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px); }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { display: inline-block; margin: 10px; padding: 12px 25px; background: linear-gradient(90deg, var(--primary), #0066ff); color: white; border: none; border-radius: 30px; font-family: 'Orbitron'; font-size: 0.8rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3); }
        .btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px var(--primary); }
        #puzzle { display: grid; margin: 20px auto; gap: 2px; border: 3px solid var(--primary); background: var(--primary); max-width: 100%; }
        .pieza { cursor: pointer; transition: filter 0.2s; background-repeat: no-repeat; }
        .pieza.selected { outline: 3px solid var(--accent); outline-offset: -3px; filter: brightness(1.3); }
        .historial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .historial-grid img { width: 100%; border-radius: 10px; border: 1px solid var(--primary); height: 100px; object-fit: cover; }
    </style>
</head>
<body>

    <audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/456"></audio>
    <audio id="swapSound" src="https://www.fesliyanstudios.com/play-mp3/457"></audio>

    <div id="menu" class="section active">
        <h1>Puzzle Protocol</h1>
        <button class="btn" onclick="mostrarSeccion('juego')">INICIAR JUEGO</button><br>
        <button class="btn" onclick="mostrarSeccion('configuracion')">CONFIGURACIÓN</button>
        <button class="btn" onclick="mostrarSeccion('historial')">HISTORIAL</button>
    </div>

    <div id="configuracion" class="section">
        <h2>Ajustes</h2>
        <label>Piezas: <input type="number" id="dim" value="3" min="2" max="56"></label><br>
        <!-- Alerta visual si se exceden los límites -->
        <p id="alertaLimite" style="color: var(--accent); font-size: 0.85rem; margin-top: 5px; display: none; font-weight: bold; text-shadow: 0 0 5px rgba(255,0,170,0.3);"></p>
        <label style="display: inline-block; margin-top: 10px;">Imagen: <input type="file" id="imagenInput" accept="image/*"></label><br>
        <button class="btn" onclick="guardarConfig()">GUARDAR</button>
    </div>

    <div id="juego" class="section">
        <h2 id="puzzleTitle">RECONSTRUYENDO...</h2>
        <div id="puzzle"></div>
        <button class="btn" onclick="mostrarSeccion('menu')">ABANDONAR</button>
    </div>

    <div id="historial" class="section">
        <h2>Historial</h2>
        <div id="listaHistorial" class="historial-grid"></div>
        <button class="btn" onclick="mostrarSeccion('menu')">VOLVER</button>
    </div>

    <script>
        let n = 3; // filas y columnas (n x n)[span_1](start_span)[span_1](end_span)
        let imagenSrc = "https://qu.ax/JrOvP.jpg"; //[span_2](start_span)[span_2](end_span)
        let seleccionada = null; //[span_3](start_span)[span_3](end_span)

        function mostrarSeccion(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove("active")); //[span_4](start_span)[span_4](end_span)
            document.getElementById(id).classList.add("active"); //[span_5](start_span)[span_5](end_span)
            if (id === "juego") iniciarJuego(); //[span_6](start_span)[span_6](end_span)
            if (id === "historial") mostrarHistorial(); //[span_7](start_span)[span_7](end_span)
        }

        function guardarConfig() {
            let inputDim = parseInt(document.getElementById("dim").value);
            const alerta = document.getElementById("alertaLimite");
            
            // VALIDACIÓN CONTRA VALORES INVALIDOS O EXCESIVOS
            if (isNaN(inputDim) || inputDim < 2) {
                n = 2; // Mínimo seguro por defecto
                alerta.style.display = "none";
            } else if (inputDim > 56) { 
                n = 56; // Límite máximo establecido
                
                // Mostrar el texto de error personalizado en el DOM
                alerta.innerText = "Excediste el límite máximo. Límite 56 = 3136 piezas.";
                alerta.style.display = "block";
                
                // Forzar el valor visualmente en el input
                document.getElementById("dim").value = n;
                return; // Detener la navegación para que el usuario verifique la alerta
            } else {
                n = inputDim;
                alerta.style.display = "none"; // Ocultar si el valor está en el rango correcto
            }

            let archivo = document.getElementById("imagenInput").files[0]; //[span_8](start_span)[span_8](end_span)
            if (archivo) { //[span_9](start_span)[span_9](end_span)
                let reader = new FileReader(); //[span_10](start_span)[span_10](end_span)
                reader.onload = (e) => { imagenSrc = e.target.result; mostrarSeccion('menu'); }; //[span_11](start_span)[span_11](end_span)
                reader.readAsDataURL(archivo); //[span_12](start_span)[span_12](end_span)
            } else { mostrarSeccion('menu'); } //[span_13](start_span)[span_13](end_span)
        }

        function iniciarJuego() {
            const puzzle = document.getElementById("puzzle"); //[span_14](start_span)[span_14](end_span)
            puzzle.innerHTML = ""; //[span_15](start_span)[span_15](end_span)
            document.getElementById("puzzleTitle").innerText = "RECONSTRUYENDO..."; //[span_16](start_span)[span_16](end_span)
            
            const size = Math.min(window.innerWidth - 60, 450); //[span_17](start_span)[span_17](end_span)
            const pSize = size / n; //[span_18](start_span)[span_18](end_span)
            puzzle.style.width = `${size}px`; //[span_19](start_span)[span_19](end_span)
            puzzle.style.gridTemplateColumns = `repeat(${n}, 1fr)`; //[span_20](start_span)[span_20](end_span)

            let piezas = []; //[span_21](start_span)[span_21](end_span)
            for (let i = 0; i < n * n; i++) { //[span_22](start_span)[span_22](end_span)
                let p = document.createElement("div"); //[span_23](start_span)[span_23](end_span)
                p.className = "pieza"; //[span_24](start_span)[span_24](end_span)
                p.style.width = `${pSize}px`; //[span_25](start_span)[span_25](end_span)
                p.style.height = `${pSize}px`; //[span_26](start_span)[span_26](end_span)
                p.style.backgroundImage = `url(${imagenSrc})`; //[span_27](start_span)[span_27](end_span)
                p.style.backgroundSize = `${size}px ${size}px`; //[span_28](start_span)[span_28](end_span)
                
                let x = -(i % n) * pSize; //[span_29](start_span)[span_29](end_span)
                let y = -Math.floor(i / n) * pSize; //[span_30](start_span)[span_30](end_span)
                p.style.backgroundPosition = `${x}px ${y}px`; //[span_31](start_span)[span_31](end_span)
                
                p.dataset.id = i; //[span_32](start_span)[span_32](end_span)
                p.onclick = () => intercambiar(p); //[span_33](start_span)[span_33](end_span)
                piezas.push(p); //[span_34](start_span)[span_34](end_span)
            }
            
            // Mezclador completamente seguro con el rango limitado
            do {
                piezas.sort(() => Math.random() - 0.5); //[span_35](start_span)[span_35](end_span)
            } while (piezas.every((p, i) => p.dataset.id == i)); //[span_36](start_span)[span_36](end_span)

            piezas.forEach(p => puzzle.appendChild(p)); //[span_37](start_span)[span_37](end_span)
        }

        function intercambiar(p) {
            document.getElementById("clickSound").play().catch(()=>{}); //[span_38](start_span)[span_38](end_span)
            if (!seleccionada) { //[span_39](start_span)[span_39](end_span)
                seleccionada = p; //[span_40](start_span)[span_40](end_span)
                p.classList.add("selected"); //[span_41](start_span)[span_41](end_span)
            } else { //[span_42](start_span)[span_42](end_span)
                if (seleccionada === p) { //[span_43](start_span)[span_43](end_span)
                    p.classList.remove("selected"); //[span_44](start_span)[span_44](end_span)
                    seleccionada = null; //[span_45](start_span)[span_45](end_span)
                    return; //[span_46](start_span)[span_46](end_span)
                }
                
                document.getElementById("swapSound").play().catch(()=>{}); //[span_47](start_span)[span_47](end_span)
                let tempBg = seleccionada.style.backgroundPosition; //[span_48](start_span)[span_48](end_span)
                let tempId = seleccionada.dataset.id; //[span_49](start_span)[span_49](end_span)
                
                seleccionada.style.backgroundPosition = p.style.backgroundPosition; //[span_50](start_span)[span_50](end_span)
                seleccionada.dataset.id = p.dataset.id; //[span_51](start_span)[span_51](end_span)
                
                p.style.backgroundPosition = tempBg; //[span_52](start_span)[span_52](end_span)
                p.dataset.id = tempId; //[span_53](start_span)[span_53](end_span)
                
                seleccionada.classList.remove("selected"); //[span_54](start_span)[span_54](end_span)
                seleccionada = null; //[span_55](start_span)[span_55](end_span)
                verificar(); //[span_56](start_span)[span_56](end_span)
            }
        }

        function verificar() {
            let piezas = Array.from(document.getElementById("puzzle").children); //[span_57](start_span)[span_57](end_span)
            let ganado = piezas.every((p, i) => p.dataset.id == i); //[span_58](start_span)[span_58](end_span)

            if (ganado) { //[span_59](start_span)[span_59](end_span)
                document.getElementById("puzzleTitle").innerText = "¡SINCRO COMPLETADA!"; //[span_60](start_span)[span_60](end_span)
                setTimeout(() => { //[span_61](start_span)[span_61](end_span)
                    alert("¡Has completado el rompecabezas!"); //[span_62](start_span)[span_62](end_span)
                    guardarHistorial(); //[span_63](start_span)[span_63](end_span)
                    mostrarSeccion("menu"); //[span_64](start_span)[span_64](end_span)
                }, 300); //[span_65](start_span)[span_65](end_span)
            }
        }

        function guardarHistorial() {
            let h = JSON.parse(localStorage.getItem("af_puzzle_log")) || []; //[span_66](start_span)[span_66](end_span)
            h.push(imagenSrc); //[span_67](start_span)[span_67](end_span)
            localStorage.setItem("af_puzzle_log", JSON.stringify(h.slice(-12))); //[span_68](start_span)[span_68](end_span)
        }

        function mostrarHistorial() {
            let lista = document.getElementById("listaHistorial"); //[span_69](start_span)[span_69](end_span)
            lista.innerHTML = ""; //[span_70](start_span)[span_70](end_span)
            let h = JSON.parse(localStorage.getItem("af_puzzle_log")) || []; //[span_71](start_span)[span_71](end_span)
            if (h.length === 0) { //[span_72](start_span)[span_72](end_span)
                lista.innerHTML = "<p>Aún no hay datos registrados.</p>"; //[span_73](start_span)[span_73](end_span)
                return; //[span_74](start_span)[span_74](end_span)
            }
            h.reverse().forEach(src => { //[span_75](start_span)[span_75](end_span)
                let img = document.createElement("img"); //[span_76](start_span)[span_76](end_span)
                img.src = src; //[span_77](start_span)[span_77](end_span)
                lista.appendChild(img); //[span_78](start_span)[span_78](end_span)
            });
        }
    </script>
</body>
</html>
