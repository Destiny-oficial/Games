<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Protocol - Anime Offis</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aaff; --accent: #ff00aa; --bg-dark: #050510; --glass: rgba(255, 255, 255, 0.05); }
        body { text-align: center; font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: white; margin: 0; padding: 20px; background: radial-gradient(circle at top right, #1a1a3a, var(--bg-dark)); min-height: 100vh; }
        h1, h2 { font-family: 'Orbitron', sans-serif; color: var(--primary); text-transform: uppercase; }
        .section { display: none; max-width: 600px; margin: auto; padding: 20px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; backdrop-filter: blur(10px); }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn { display: inline-block; margin: 10px; padding: 12px 25px; background: linear-gradient(90deg, var(--primary), #0066ff); color: white; border: none; border-radius: 30px; font-family: 'Orbitron'; font-size: 0.8rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 170, 255, 0.3); }
        .btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px var(--primary); }
        #puzzle { display: grid; margin: 20px auto; gap: 2px; border: 3px solid var(--primary); background: var(--primary); max-width: 100%; }
        .pieza { cursor: pointer; transition: filter 0.2s; background-repeat: no-repeat; }
        .pieza.selected { outline: 3px solid var(--accent); outline-offset: -3px; filter: brightness(1.3); }
        .historial-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .historial-grid img { width: 100%; border-radius: 10px; border: 1px solid var(--primary); height: 100px; object-fit: cover; }
    </style>
</head>
<body>

    <audio id="clickSound" src="https://www.fesliyanstudios.com/play-mp3/456"></audio>
    <audio id="swapSound" src="https://www.fesliyanstudios.com/play-mp3/457"></audio>

    <div id="menu" class="section active">
        <h1>Puzzle Protocol</h1>
        <button class="btn" onclick="mostrarSeccion('juego')">INICIAR JUEGO</button><br>
        <button class="btn" onclick="mostrarSeccion('configuracion')">CONFIGURACIÓN</button>
        <button class="btn" onclick="mostrarSeccion('historial')">HISTORIAL</button>
    </div>

    <div id="configuracion" class="section">
        <h2>Ajustes</h2>
        <label>Piezas: <input type="number" id="dim" value="3" min="2" max="6"></label><br>
        <label>Imagen: <input type="file" id="imagenInput" accept="image/*"></label><br>
        <button class="btn" onclick="guardarConfig()">GUARDAR</button>
    </div>

    <div id="juego" class="section">
        <h2 id="puzzleTitle">RECONSTRUYENDO...</h2>
        <div id="puzzle"></div>
        <button class="btn" onclick="mostrarSeccion('menu')">ABANDONAR</button>
    </div>

    <div id="historial" class="section">
        <h2>Historial</h2>
        <div id="listaHistorial" class="historial-grid"></div>
        <button class="btn" onclick="mostrarSeccion('menu')">VOLVER</button>
    </div>

    <script>
        let n = 3; // filas y columnas (n x n)
        let imagenSrc = "https://qu.ax/JrOvP.jpg";
        let seleccionada = null;

        function mostrarSeccion(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove("active"));
            document.getElementById(id).classList.add("active");
            if (id === "juego") iniciarJuego();
            if (id === "historial") mostrarHistorial();
        }

        function guardarConfig() {
            n = parseInt(document.getElementById("dim").value);
            let archivo = document.getElementById("imagenInput").files[0];
            if (archivo) {
                let reader = new FileReader();
                reader.onload = (e) => { imagenSrc = e.target.result; mostrarSeccion('menu'); };
                reader.readAsDataURL(archivo);
            } else { mostrarSeccion('menu'); }
        }

        function iniciarJuego() {
            const puzzle = document.getElementById("puzzle");
            puzzle.innerHTML = "";
            document.getElementById("puzzleTitle").innerText = "RECONSTRUYENDO...";
            
            const size = Math.min(window.innerWidth - 60, 450);
            const pSize = size / n;
            puzzle.style.width = `${size}px`;
            puzzle.style.gridTemplateColumns = `repeat(${n}, 1fr)`;

            let piezas = [];
            for (let i = 0; i < n * n; i++) {
                let p = document.createElement("div");
                p.className = "pieza";
                p.style.width = `${pSize}px`;
                p.style.height = `${pSize}px`;
                p.style.backgroundImage = `url(${imagenSrc})`;
                p.style.backgroundSize = `${size}px ${size}px`;
                
                // Posición de fondo basada en el índice original
                let x = -(i % n) * pSize;
                let y = -Math.floor(i / n) * pSize;
                p.style.backgroundPosition = `${x}px ${y}px`;
                
                p.dataset.id = i; // El ID es la posición correcta
                p.onclick = () => intercambiar(p);
                piezas.push(p);
            }
            
            // Mezclamos hasta que el orden sea diferente al original
            do {
                piezas.sort(() => Math.random() - 0.5);
            } while (piezas.every((p, i) => p.dataset.id == i));

            piezas.forEach(p => puzzle.appendChild(p));
        }

        function intercambiar(p) {
            document.getElementById("clickSound").play().catch(()=>{});
            if (!seleccionada) {
                seleccionada = p;
                p.classList.add("selected");
            } else {
                if (seleccionada === p) {
                    p.classList.remove("selected");
                    seleccionada = null;
                    return;
                }
                
                document.getElementById("swapSound").play().catch(()=>{});
                // Intercambiamos POSICIÓN DE FONDO y DATA-ID
                let tempBg = seleccionada.style.backgroundPosition;
                let tempId = seleccionada.dataset.id;
                
                seleccionada.style.backgroundPosition = p.style.backgroundPosition;
                seleccionada.dataset.id = p.dataset.id;
                
                p.style.backgroundPosition = tempBg;
                p.dataset.id = tempId;
                
                seleccionada.classList.remove("selected");
                seleccionada = null;
                verificar();
            }
        }

        function verificar() {
            let piezas = Array.from(document.getElementById("puzzle").children);
            // Ahora comparamos si el DATA-ID de la pieza coincide con su posición en el Grid (i)
            let ganado = piezas.every((p, i) => p.dataset.id == i);

            if (ganado) {
                document.getElementById("puzzleTitle").innerText = "¡SINCRO COMPLETADA!";
                setTimeout(() => {
                    alert("¡Has completado el rompecabezas!");
                    guardarHistorial();
                    mostrarSeccion("menu");
                }, 300);
            }
        }

        function guardarHistorial() {
            let h = JSON.parse(localStorage.getItem("af_puzzle_log")) || [];
            h.push(imagenSrc);
            localStorage.setItem("af_puzzle_log", JSON.stringify(h.slice(-12))); // Guardamos los últimos 12
        }

        function mostrarHistorial() {
            let lista = document.getElementById("listaHistorial");
            lista.innerHTML = "";
            let h = JSON.parse(localStorage.getItem("af_puzzle_log")) || [];
            if (h.length === 0) {
                lista.innerHTML = "<p>Aún no hay datos registrados.</p>";
                return;
            }
            h.reverse().forEach(src => { // Los más recientes primero
                let img = document.createElement("img");
                img.src = src;
                lista.appendChild(img);
            });
        }
    </script>
</body>
</html>
