<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ranking - Anime Offis</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #00aaff;
            --secondary: #ff00aa;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(0, 170, 255, 0.3);
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at center, #111 0%, var(--bg) 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .ranking-container {
            width: 90%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
        }
        h1 { text-align: center; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
        .leaderboard-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .player-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; animation: slideIn 0.4s ease forwards; opacity: 0;
        }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        .rank { font-size: 1.2rem; font-weight: bold; width: 40px; text-align: center; }
        .player-info { flex-grow: 1; padding: 0 10px; }
        .name { font-size: 1rem; text-transform: uppercase; font-weight: bold; }
        .date-text { font-size: 0.65rem; color: #888; }
        .score-val { font-size: 1.2rem; font-weight: bold; color: var(--secondary); }
        .rank-1 { border-color: var(--gold); background: rgba(255, 215, 0, 0.05); }
        .verified-badge { color: #00ffaa; margin-left: 5px; text-shadow: 0 0 5px #00ffaa; }
        .game-btn {
            padding: 12px 24px; color: white; background: rgba(0, 170, 255, 0.1);
            border: 2px solid var(--primary); border-radius: 30px; cursor: pointer;
            text-decoration: none; display: inline-block; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="ranking-container">
        <h1>👑 TOP AGENTES</h1>
        <div id="loading-text" style="text-align: center; color: var(--primary);">Sincronizando...</div>
        <ul class="leaderboard-list" id="leaderboard-list"></ul>
        <div style="text-align:center;"><a href="index.html" class="game-btn">VOLVER</a></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAu0WbdAi8_yA2S6qKMUCLfty5w0PxgKVE",
            authDomain: "anime-offis.firebaseapp.com",
            projectId: "anime-offis",
            storageBucket: "anime-offis.appspot.com",
            messagingSenderId: "377121993034",
            appId: "1:377121993034:web:a4ba7995e827bcbea411b3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            const loading = document.getElementById('loading-text');
            try {
                const querySnapshot = await db.collection("juegosor").orderBy("score", "desc").limit(20).get();
                loading.style.display = 'none';
                let rank = 1;

                for (const doc of querySnapshot.docs) {
                    const data = doc.data();
                    const userId = doc.id;
                    const username = data.username || "Desconocido";
                    const score = data.score || 0;
                    const currentRank = rank++;

                    let dateStr = "Reciente";
                    if (data.timestamp) dateStr = data.timestamp.toDate().toLocaleDateString('es-MX');

                    const li = document.createElement('li');
                    li.className = `player-row ${currentRank === 1 ? 'rank-1' : ''}`;
                    li.style.animationDelay = `${currentRank * 0.1}s`;
                    li.innerHTML = `
                        <div class="rank">${currentRank === 1 ? '🥇' : currentRank === 2 ? '🥈' : currentRank === 3 ? '🥉' : currentRank}</div>
                        <div class="player-info">
                            <div class="name">${username} <span id="badge-${userId}"></span></div>
                            <div class="date-text">Logrado: ${dateStr}</div>
                        </div>
                        <div class="score-val">${score}</div>
                    `;
                    list.appendChild(li);

                    // Verificación Manual (Solo lectura)
                    db.collection("users").doc(userId).get().then(userDoc => {
                        if (userDoc.exists && userDoc.data().verified?.includes("topbd")) {
                            document.getElementById(`badge-${userId}`).innerHTML = `🛡️`;
                        }
                    }).catch(()=>{});
                }
            } catch (e) { loading.innerText = "Error de conexión."; }
        }
        window.onload = loadLeaderboard;
    </script>
</body>
</html>
